name: publish
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:
    inputs:
      stage:
        description: Runners account to publish to
        type: choice
        options: [staging, prod]
        default: staging
      os_capabilities_all:
        description: Publish with additionalOsCapabilities ALL (only if /validate failed with "capabilities:")
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

defaults:
  run:
    shell: bash

env:
  STAGE: ${{ inputs.stage || 'staging' }}

concurrency:
  group: publish-${{ inputs.stage || 'staging' }}
  cancel-in-progress: false

jobs:
  publish:
    # php85: Laravel apps. go: Go apps (one image for every Go version; Cloud's CLOUD_RUNNERS_*_GO settings).
    strategy:
      fail-fast: false
      matrix:
        image: [php85, go]
    runs-on: ubuntu-24.04-arm
    environment: ${{ inputs.stage || 'staging' }}
    env:
      IMAGE: ${{ matrix.image }}
      GH_TOKEN: ${{ github.token }}
      ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
      BUILD_ROLE_ARN: ${{ vars.BUILD_ROLE_ARN }}
      ECR_REPO: ${{ vars.ECR_REPO }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      # No install scripts needed: esbuild and tsx work without esbuild's optional postinstall (verified on linux/arm64).
      - run: npm ci --ignore-scripts
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.PUBLISHER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Fetch inputs
        run: npx tsx scripts/fetch-inputs.ts --image "$IMAGE" --out build/inputs
      - run: node agent/build.mjs
      - name: Package
        run: >
          npx tsx scripts/package-image.ts --image "$IMAGE" --inputs build/inputs --out build/image.zip
          --agent agent/dist/arco-runner.mjs --fixture fixture
      - name: Publish MicroVM image
        id: microvm
        env:
          OS_CAPABILITIES_ALL: ${{ inputs.os_capabilities_all && '--os-capabilities-all' || '' }}
        run: |
          # shellcheck disable=SC2086
          npx tsx scripts/publish-microvm-image.ts --stage "$STAGE" --zip build/image.zip --image "$IMAGE" $OS_CAPABILITIES_ALL | tee build/publish.log
          echo "image_arn=$(sed -n 's/^image_arn=//p' build/publish.log)" >> "$GITHUB_OUTPUT"
          echo "image_version=$(sed -n 's/^image_version=//p' build/publish.log)" >> "$GITHUB_OUTPUT"

      - name: Build and push the Fargate image
        id: fargate
        run: |
          # ECR tags are immutable: the run id and attempt keep a scheduled rebuild of an unchanged main (or a re-run) unique.
          image="$ECR_REPO:${IMAGE}-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          registry="${ECR_REPO%%/*}"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          mkdir build/context && unzip -q build/image.zip -d build/context
          docker build --platform linux/arm64 -t "$image" build/context
          docker push "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Register the Fargate task definition
        id: taskdef
        env:
          EXECUTION_ROLE_ARN: ${{ vars.FARGATE_EXECUTION_ROLE_ARN }}
          RUNNER_IMAGE: ${{ matrix.image }}
          IMAGE: ${{ steps.fargate.outputs.image }}
        run: |
          jq -n \
            --arg family "arco-runner-$RUNNER_IMAGE" \
            --arg prefix "$RUNNER_IMAGE" \
            --arg image "$IMAGE" \
            --arg role "$EXECUTION_ROLE_ARN" \
            --arg region "$AWS_REGION" '{
              family: $family,
              requiresCompatibilities: ["FARGATE"],
              networkMode: "awsvpc",
              cpu: "2048",
              memory: "4096",
              runtimePlatform: {cpuArchitecture: "ARM64", operatingSystemFamily: "LINUX"},
              ephemeralStorage: {sizeInGiB: 30},
              executionRoleArn: $role,
              containerDefinitions: [{
                name: "runner",
                image: $image,
                essential: true,
                stopTimeout: 30,
                logConfiguration: {
                  logDriver: "awslogs",
                  options: {"awslogs-group": "/ecs/arco-runner", "awslogs-region": $region, "awslogs-stream-prefix": $prefix}
                }
              }]
            }' > build/taskdef.json
          arn=$(aws ecs register-task-definition --cli-input-json file://build/taskdef.json --query taskDefinition.taskDefinitionArn --output text)
          echo "task_definition_arn=$arn" >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          IMAGE_ARN: ${{ steps.microvm.outputs.image_arn }}
          IMAGE_VERSION: ${{ steps.microvm.outputs.image_version }}
          TASK_DEFINITION_ARN: ${{ steps.taskdef.outputs.task_definition_arn }}
          FARGATE_IMAGE: ${{ steps.fargate.outputs.image }}
        run: |
          # Cloud's suffix: php85 -> 85 (runners.php_versions), go -> GO (runners.go_image).
          if [ "$IMAGE" = go ]; then suffix=GO; else suffix="${IMAGE#php}"; fi
          {
            echo "### Arco runner image \`$IMAGE\` published to $STAGE"
            echo
            echo "Set these in Arco Cloud and redeploy:"
            echo
            echo '```'
            echo "CLOUD_RUNNERS_IMAGE_ARN_${suffix}=$IMAGE_ARN"
            echo "CLOUD_RUNNERS_IMAGE_VERSION_${suffix}=$IMAGE_VERSION"
            echo "CLOUD_RUNNERS_TASK_DEFINITION_${suffix}=$TASK_DEFINITION_ARN"
            echo '```'
            echo
            echo "Fargate image: \`$FARGATE_IMAGE\`"
          } >> "$GITHUB_STEP_SUMMARY"
