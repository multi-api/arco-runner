name: prune
on:
  workflow_dispatch:
    inputs:
      stage:
        description: Runners account
        type: choice
        options: [staging, prod]
        required: true
      in_use_version:
        description: Image version Cloud currently uses (CLOUD_RUNNERS_IMAGE_VERSION_85)
        type: string
        required: true

permissions:
  id-token: write
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: publish-${{ inputs.stage }}
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-24.04-arm
    environment: ${{ inputs.stage }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      # No install scripts needed: tsx works without esbuild's optional postinstall (verified on linux/arm64).
      - run: npm ci --ignore-scripts
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.PUBLISHER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Delete old versions
        env:
          IN_USE_VERSION: ${{ inputs.in_use_version }}
          PUBLISHER_ROLE_ARN: ${{ vars.PUBLISHER_ROLE_ARN }}
        run: npx tsx scripts/prune-microvm-images.ts --minor 8.5 --in-use-version "$IN_USE_VERSION"
