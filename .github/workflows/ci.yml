name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq zstd
      - run: npm ci
      - name: Typecheck
        run: |
          npx tsc -p scripts --noEmit
          npx tsc -p agent --noEmit
      - run: npm test
      - run: node agent/build.mjs

  image:
    runs-on: ubuntu-24.04-arm
    needs: unit
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node agent/build.mjs
      - name: Fetch inputs
        run: npx tsx scripts/fetch-inputs.ts --minor 8.5 --out build/inputs
      - name: Package
        run: >
          npx tsx scripts/package-image.ts --minor 8.5 --inputs build/inputs --out build/image.zip
          --agent agent/dist/arco-runner.mjs --fixture fixture
      - name: Build image
        run: |
          mkdir build/context && unzip -q build/image.zip -d build/context
          docker build --platform linux/arm64 -t arco-runner:ci build/context
      - name: Integration tests
        if: hashFiles('integration/package.json') != ''
        env:
          ARCO_RUNNER_IMAGE: arco-runner:ci
        run: |
          npm ci --prefix integration
          npm --prefix integration run typecheck
          npm run test:integration
